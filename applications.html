<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D X-ray Microscopy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="header"></div>

<section class="scan-case">
  <h2>Phân tích nến</h2>

  <div class="scan-gallery">
    <div class="scan-item">
      <img src="Images/Candle4.PNG" alt="2D scan">
      <p>Ảnh lát cắt 2D</p>
    </div>

    <div class="scan-item">
      <img src="Images/Candle3.png" alt="3D scan">
      <p>Tái tạo 3D</p>
    </div>

    <div class="scan-item">
      <img src="Images/Candle1.png" alt="Analysis 1">
      <p>Phân tích cấu trúc</p>
    </div>

    <div class="scan-item">
      <img src="Images/Candle2.png" alt="Analysis 2">
      <p>Phát hiện khuyết tật (bọt khí)</p>
    </div>
  </div>

<h2>Phân tích quả vải</h2>

<div class="scan-gallery">
  <div class="scan-item">
    <img src="Images/Lichi2.png" alt="2D scan">
    <p>Ảnh lát cắt 2D</p>
  </div>

  <div class="scan-item">
    <img src="Images/Lichi4.png" alt="3D scan">
    <p>Tái tạo 3D</p>
  </div>

  <div class="scan-item">
    <img src="Images/Lichi1.png" alt="Structure">
    <p>Phân tích cấu trúc nội bộ</p>
  </div>

  <div class="scan-item">
    <img src="Images/Lichi3.png" alt="Reconstructed slice">
    <p>Lát cắt độ phân giải cao</p>
  </div>
</div>


</section>

<div id="footer"></div>

<script>
  async function loadPartial(id, file) {
    const el = document.getElementById(id);
    if (el) {
      const res = await fetch(file);
      el.innerHTML = await res.text();
    }
  }
  loadPartial('header', 'header.html');
  loadPartial('footer', 'footer.html');
</script>

</body>
</html>
